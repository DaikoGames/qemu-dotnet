
name: Build QEMU

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-2022
            os: windows
            msystem: MINGW64
            prefix: mingw-w64-x86_64-

          - name: windows-arm64
            runner: windows-11-arm
            os: windows
            msystem: CLANGARM64
            prefix: mingw-w64-clang-aarch64-

          - name: macos-x64
            runner: macos-15-intel
            os: macos

          - name: macos-arm64
            runner: macos-15
            os: macos

          - name: linux-x64
            runner: ubuntu-24.04
            os: linux

          - name: linux-arm32
            runner: ubuntu-24.04
            os: linux

          - name: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux

    steps:
      # Windows: enable long paths before checkout
      - name: Enable Git long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true

      # Checkout repository without recursively checking out submodules
      - name: Checkout QEMU
        uses: actions/checkout@v4
        with:
          repository: qemu/qemu
          path: q
          submodules: false
          persist-credentials: false

      # Initialize submodules with Git long paths enabled
      - name: Checkout QEMU submodules
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          cd q
          git -c core.longpaths=true submodule update --init --recursive

      - name: Checkout QEMU submodules (Unix)
        if: runner.os != 'Windows'
        run: git -C q submodule update --init --recursive

      # Windows dependencies
      - name: Setup MSYS2
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            base-devel
            git
            diffutils
            flex
            bison
            ${{ matrix.prefix }}toolchain
            ${{ matrix.prefix }}glib2
            ${{ matrix.prefix }}pixman
            ${{ matrix.prefix }}ninja
            ${{ matrix.prefix }}meson
            ${{ matrix.prefix }}python
            ${{ matrix.prefix }}pkgconf
            ${{ matrix.prefix }}zstd

      # Linux dependencies
      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            meson \
            python3 \
            python3-venv \
            pkg-config \
            libglib2.0-dev \
            libpixman-1-dev \
            zlib1g-dev \
            libfdt-dev \
            libslirp-dev \
            libgcrypt20-dev \
            libcap-ng-dev \
            libattr1-dev \
            liburing-dev

      # macOS dependencies
      - name: Install macOS dependencies
        if: matrix.os == 'macos'
        run: |
          brew install meson ninja glib pixman pkgconf

      # Configure Windows
      - name: Configure Windows
        if: matrix.os == 'windows'
        shell: msys2 {0}
        working-directory: q
        run: |
          ./configure \
            --prefix=/usr \
            --target-list=x86_64-softmmu,aarch64-softmmu \
            --disable-werror

      # Configure macOS
      - name: Configure macOS
        if: matrix.os == 'macos'
        working-directory: q
        run: |
          ./configure \
            --prefix=/usr/local \
            --target-list=x86_64-softmmu,aarch64-softmmu \
            --disable-werror

      # Configure Linux
      - name: Configure Linux
        if: matrix.os == 'linux'
        working-directory: q
        run: |
          ./configure \
            --prefix=/usr \
            --target-list=x86_64-softmmu,aarch64-softmmu \
            --disable-werror

      # Build Windows
      - name: Build Windows
        if: matrix.os == 'windows'
        shell: msys2 {0}
        working-directory: q
        run: ninja -C build

      # Build macOS and Linux
      - name: Build Unix
        if: matrix.os != 'windows'
        working-directory: q
        run: ninja -C build

      # Install Windows
      - name: Install Windows
        if: matrix.os == 'windows'
        shell: msys2 {0}
        working-directory: q
        run: |
          mkdir -p stage
          DESTDIR="$PWD/stage" ninja -C build install

      # Install macOS and Linux
      - name: Install Unix
        if: matrix.os != 'windows'
        working-directory: q
        run: |
          mkdir -p stage
          DESTDIR="$PWD/stage" ninja -C build install

      # Upload artifacts
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: qemu-${{ matrix.name }}
          path: q/stage/
          if-no-files-found: error
          compression-level: 6
