
name: Build QEMU

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-2022
            os: windows
            arch: x64
            msystem: MINGW64
            prefix: mingw-w64-x86_64-

          - name: windows-arm64
            runner: windows-11-arm
            os: windows
            arch: arm64
            msystem: CLANGARM64
            prefix: mingw-w64-clang-aarch64-

          - name: macos-x64
            runner: macos-15-intel
            os: macos
            arch: x64

          - name: macos-arm64
            runner: macos-15
            os: macos
            arch: arm64

          - name: linux-x64
            runner: ubuntu-24.04
            os: linux
            arch: x64

          - name: linux-arm32
            runner: ubuntu-24.04
            os: linux
            arch: arm32

          - name: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64

    steps:
      - name: Checkout QEMU
        uses: actions/checkout@v4
        with:
          repository: qemu/qemu
          submodules: recursive

      - name: Install MSYS2
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            base-devel
            git
            diffutils
            flex
            bison
            ${{ matrix.prefix }}toolchain
            ${{ matrix.prefix }}glib2
            ${{ matrix.prefix }}pixman
            ${{ matrix.prefix }}zstd
            ${{ matrix.prefix }}ninja
            ${{ matrix.prefix }}meson
            ${{ matrix.prefix }}python
            ${{ matrix.prefix }}pkgconf

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            meson \
            python3 \
            python3-venv \
            pkg-config \
            libglib2.0-dev \
            libpixman-1-dev \
            zlib1g-dev \
            libfdt-dev \
            libslirp-dev \
            libgcrypt20-dev \
            libcap-ng-dev \
            libattr1-dev \
            liburing-dev

      - name: Install macOS dependencies
        if: matrix.os == 'macos'
        run: |
          brew install meson ninja glib pixman pkgconf

      - name: Configure Windows
        if: matrix.os == 'windows'
        shell: msys2 {0}
        run: |
          mkdir -p build
          cd build
          ../configure \
            --prefix=/usr \
            --target-list=x86_64-softmmu,aarch64-softmmu \
            --disable-werror

      - name: Configure macOS
        if: matrix.os == 'macos'
        run: |
          mkdir -p build
          cd build
          ../configure \
            --prefix=/usr/local \
            --target-list=x86_64-softmmu,aarch64-softmmu \
            --disable-werror

      - name: Configure Linux
        if: matrix.os == 'linux'
        run: |
          mkdir -p build
          cd build
          ../configure \
            --prefix=/usr \
            --target-list=x86_64-softmmu,aarch64-softmmu \
            --disable-werror

      - name: Build
        if: matrix.os != 'windows'
        run: ninja -C build

      - name: Build Windows
        if: matrix.os == 'windows'
        shell: msys2 {0}
        run: ninja -C build

      - name: Stage Linux and macOS artifacts
        if: matrix.os != 'windows'
        run: |
          DESTDIR="$PWD/stage" ninja -C build install

      - name: Stage Windows artifacts
        if: matrix.os == 'windows'
        shell: msys2 {0}
        run: |
          DESTDIR="$PWD/stage" ninja -C build install

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qemu-${{ matrix.name }}
          path: stage/
          if-no-files-found: error
          compression-level: 6
